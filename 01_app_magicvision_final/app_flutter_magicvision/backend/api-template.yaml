AWSTemplateFormatVersion: '2010-09-09'
Description: MagicVision asynchronous mobile API; uses existing SageMaker endpoint and IAM role.
Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  EndpointName:
    Type: String
  ExecutionRoleArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:role/.+'
  AllowedClientCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12][0-9]|[1-9])'
    Description: Authorized laboratory public egress CIDR; must not be /0.
Resources:
  Function:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Handler: api.handler
      Runtime: python3.11
      Architectures: [x86_64]
      Role: !Ref ExecutionRoleArn
      MemorySize: 512
      Timeout: 28
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          INFERENCE_MODE: async
          ASYNC_BUCKET: !Ref CodeBucket
          SAGEMAKER_ENDPOINT_NAME: !Ref EndpointName
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Function}'
      RetentionInDays: 14
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}'
      EndpointConfiguration:
        Types: [REGIONAL]
      BinaryMediaTypes: ['multipart/form-data']
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: execute-api:Invoke
            Resource: 'execute-api:/*'
          - Effect: Deny
            Principal: '*'
            Action: execute-api:Invoke
            Resource: 'execute-api:/*'
            Condition:
              NotIpAddress:
                aws:SourceIp: !Ref AllowedClientCidr
  Proxy:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: '{proxy+}'
  Method:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref Proxy
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        TimeoutInMillis: 29000
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations'
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*'
  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: Method
    Properties:
      RestApiId: !Ref Api
  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: prod
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
          DataTraceEnabled: false
Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  FunctionName:
    Value: !Ref Function

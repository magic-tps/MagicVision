# E0 is evaluated with the untouched ten-class checkpoint using evaluation/evaluate_models.py.
common:
  epochs: 100
  patience: 20
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  seed: 42
  deterministic: true
  workers: 0
  cache: false
  amp: true
  hsv_h: 0.01
  hsv_s: 0.3
  hsv_v: 0.25
  degrees: 3.0
  translate: 0.05
  scale: 0.2
  perspective: 0.0001
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.2
  close_mosaic: 15
  mixup: 0.0
  copy_paste: 0.0
experiments:
  E1:
    imgsz: 640
  E2:
    imgsz: 960
  E3:
    imgsz: 640
    # Start from the validation-selected candidate and a newly versioned reviewed dataset.
    # Change imgsz only if E2 wins validation; never select using test.
